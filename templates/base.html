<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Event Manager{% endblock title %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* For copy tooltip and selection */
        input[readonly] {
            cursor: pointer;
            user-select: all;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <!-- Navigation -->
    <nav class="bg-white shadow">
        <div class="w-full mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="{% url 'home' %}" class="text-xl font-bold text-blue-600">FlexUp Events</a>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-6">
                        <a href="{% url 'home' %}" class="inline-flex items-center px-1 pt-1 border-b-2 {% if request.path == '/' %}border-blue-500 text-gray-900{% else %}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{% endif %}">
                            Home
                        </a>
                        <a href="{% url 'events' %}" class="inline-flex items-center px-1 pt-1 border-b-2 {% if '/events/' in request.path %}border-blue-500 text-gray-900{% else %}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{% endif %}">
                            Events
                        </a>
                        <a href="{% url 'dashboard' %}" class="inline-flex items-center px-1 pt-1 border-b-2 {% if '/dashboard/' in request.path %}border-blue-500 text-gray-900{% else %}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{% endif %}">
                            My Dashboard
                        </a>
                    </div>
                </div>
                <div class="hidden sm:ml-6 sm:flex sm:items-center">
                    <a href="{% url 'event_create' %}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Create Event
                    </a>
                </div>
                <div class="-mr-2 flex items-center sm:hidden">
                    <!-- Mobile menu button -->
                    <button type="button" class="mobile-menu-button inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500" aria-controls="mobile-menu" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile menu, show/hide based on menu state. -->
        <div class="hidden sm:hidden" id="mobile-menu">
            <div class="pt-2 pb-3 space-y-1">
                <a href="{% url 'home' %}" class="block pl-3 pr-4 py-2 border-l-4 {% if request.path == '/' %}border-blue-500 text-blue-700 bg-blue-50{% else %}border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800{% endif %} text-base font-medium">
                    Home
                </a>
                <a href="{% url 'events' %}" class="block pl-3 pr-4 py-2 border-l-4 {% if '/events/' in request.path %}border-blue-500 text-blue-700 bg-blue-50{% else %}border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800{% endif %} text-base font-medium">
                    Events
                </a>
                <a href="{% url 'dashboard' %}" class="block pl-3 pr-4 py-2 border-l-4 {% if '/dashboard/' in request.path %}border-blue-500 text-blue-700 bg-blue-50{% else %}border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800{% endif %} text-base font-medium">
                    My Dashboard
                </a>
                <div class="pt-4 pb-2">
                    <a href="{% url 'event_create' %}" class="block text-center mx-4 btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Create Event
                    </a>
                </div>
            </div>
        </div>
    </nav>

    {% if messages %}
    <div class="fixed bottom-20 right-4 z-50">
        {% for message in messages %}
        <div class="{% if message.tags == 'success' %}bg-green-500 text-white border-green-500{% else %}bg-red-500 text-white border-red-500{% endif %} border-l-4 p-4 mb-4 shadow-lg rounded">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    

    <main class="mx-auto px-4 py-8" {% if not form.instance.pk or editable %}style="margin-top: 80px;"{%endif%}>

        {% block content %}{% endblock content %}
    </main>

    <script>
        // Mobile menu toggle
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuButton = document.querySelector('.mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            
            if (mobileMenuButton && mobileMenu) {
                mobileMenuButton.addEventListener('click', function() {
                    mobileMenu.classList.toggle('hidden');
                });
            }
        });
    </script>
</body>
</html>
