<tr id="row-id{{response.slug}}">

    <form method="POST"
        class="update-form"
        hx-post="{% url 'edit_response' response.slug %}"
        >
        <td>
            <input type="text" name="response" maxlength="100" required id="id_response"
                    value="{{ response.response }}">
        </td>
        <td>
            <select name="status" required id="id_status">
                <option value="INVITED" {% if response.status == "INVITED" %}selected{% endif %}>Invited</option>
                <option value="CONFIRMED" {% if response.status == "CONFIRMED" %}selected{% endif %}>Confirmed</option>
                <option value="DECLINED" {% if response.status == "DECLINED" %}selected{% endif %}>Declined</option>
                <option value="MAYBE" {% if response.status == "MAYBE" %}selected{% endif %}>Maybe</option>
                <option value="WAITING_LIST" {% if response.status == "WAITING_LIST" %}selected{% endif %}>Waiting list</option>
            </select>
        </td>
        <td>
            {% csrf_token %}
            <input type="hidden" name="event" value="{{response.event.id}}" id="id_event">
            <button class="btn btn-primary" type="submit">Update</button>
            <button class="btn btn-danger" type="button" 
            hx-delete="/delete_response/{{response.slug}}"
            hx-target="#row-id{{response.slug}}"
            hx-confirm="Are you sure you want to delete this response?"
            hx-swap="delete">Delete</button>
        </td>
    </form>
</tr>
